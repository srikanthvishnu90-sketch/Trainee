# Release item 2 bench (branch bench/browser-batch60 only, never a PR): the batch of 60 through the apply VM's pool.
# 1. scripts/browser-eval/batch60.cjs: 60 REAL public postings from sample.csv, a DRY RUN: every request but GET/HEAD/OPTIONS
#    aborted in the browser, every form submit cancelled by a page script, the run stopped before the Submit click, robots.txt
#    obeyed, 1 page load a second per host. A synthetic TEST person and resume. No secrets. Nothing is submitted.
# 2. tests/career-batch60-fixture.test.cjs: 60 mock postings on 127.0.0.1 on a throwaway Postgres, receipts and the one closeout.
name: browser-bench
on:
  push:
    branches: ["bench/browser-*"]
permissions:
  contents: read
jobs:
  batch60:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Playwright and its Chromium
        run: |
          npm ci --prefix tools --no-audit --no-fund
          (cd tools && npx --no-install playwright install --with-deps chromium)
          echo "UPMORE_PLAYWRIGHT_PATH=$GITHUB_WORKSPACE/tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Allow sandboxed Chromium user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Fixture of 60 (real queue on Postgres 16, mock employers, receipts and the one closeout)
        if: always()
        run: PGBIN=/usr/lib/postgresql/16/bin PATH=/usr/lib/postgresql/16/bin:$PATH node --test tests/career-batch60-fixture.test.cjs
      - name: Batch of 60 real postings through the apply VM's pool (dry run; nothing is submitted)
        if: always()
        run: node scripts/browser-eval/batch60.cjs --sample scripts/browser-eval/sample.csv --n 60 --concurrency 6 --label "batch60-${GITHUB_SHA::8}"
