# Round 2 of ag/runner-strict: the strict benchmark (headline, open-only reading, --answered column) on sample and heldout, default
# persona. Branch bench/browser-strict-r2 only, never a PR. DRY RUN on real public postings: every request but GET/HEAD/OPTIONS (and a
# GraphQL read) aborted in the browser, submits trapped, stopped before the Submit click, robots.txt obeyed. Synthetic TEST person.
name: browser-bench
on:
  push:
    branches: ["bench/browser-*"]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sample: [sample, heldout]
        persona: [default]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Playwright and its Chromium
        run: |
          npm ci --prefix tools --no-audit --no-fund
          (cd tools && npx --no-install playwright install --with-deps chromium)
          echo "UPMORE_PLAYWRIGHT_PATH=$GITHUB_WORKSPACE/tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Strict benchmark (nothing is submitted)
        run: |
          label="r2-${{ matrix.sample }}-${{ matrix.persona }}-$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          extra=""; [ "${{ matrix.persona }}" != "default" ] && extra="--persona ${{ matrix.persona }}"
          node scripts/browser-eval/strict.cjs --sample "scripts/browser-eval/${{ matrix.sample }}.csv" --label "$label" --max-per-provider 20 --answered $extra
          cat "artifacts/browser-eval/$label/strict-summary.md" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const s=require(process.argv[1]); console.log(`BOTH | ${process.argv[2]} | pass ${s.all.pass} / ${s.all.sampled} | ready_if_answered ${s.all.ready_if_answered} | ready_except_upload ${s.all.ready_except_upload} | breaches ${s.all.breaches}`); const o = s.all.open; console.log(`OPEN | ${process.argv[2]} | pass ${o.pass} / ${o.sampled} | answered ${o.answered_pass} (+${o.answered_upload}) | closed ${o.closed} (at start ${o.closed_at_start})`); console.log(`ANSWERED-ALL | ${process.argv[2]} | ${s.all.answered_pass} (+${s.all.answered_upload}) / ${s.all.sampled}`); for (const p of s.prov) console.log(`PROVA | ${process.argv[2]} | ${p.provider} | pass ${p.pass} | answered ${p.answered_pass} (+${p.answered_upload}) | open ${p.open.sampled} | open pass ${p.open.pass} | open answered ${p.open.answered_pass} | ${(p.answered_top_fail||[]).map(([k,n])=>k+" "+n).join("; ")}`); for (const p of s.prov) console.log(`PROV | ${process.argv[2]} | ${p.provider} | pass ${p.pass} | ria ${p.ready_if_answered} | reu ${p.ready_except_upload} | fail ${p.fail} | ${p.top_fail.map(([k,n])=>k+" "+n).join("; ")}`)' "$PWD/artifacts/browser-eval/$label/strict-summary.json" "${{ matrix.sample }}-${{ matrix.persona }}"
      - name: Keep the per-posting rows (D-072 root causes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-${{ matrix.sample }}-${{ matrix.persona }}
          path: artifacts/browser-eval/
          retention-days: 14
