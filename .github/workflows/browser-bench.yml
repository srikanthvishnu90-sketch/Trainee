# Bench only (task b-workable-breezy): GET-only markup capture of the Workable / Breezy postings the strict runner stopped on,
# then the strict benchmark on those two boards. Nothing is submitted (strict.cjs rules; capture.cjs aborts every non-GET).
name: browser-bench
on:
  push:
    branches: ["bench/browser-wb-*"]
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Playwright and its Chromium
        run: |
          npm ci --prefix tools --no-audit --no-fund
          (cd tools && npx --no-install playwright install --with-deps chromium)
          echo "UPMORE_PLAYWRIGHT_PATH=$GITHUB_WORKSPACE/tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Capture markup (GET only)
        if: hashFiles('scripts/browser-eval/capture.cjs') != ''
        run: |
          node scripts/browser-eval/capture.cjs \
            https://lexlegis.breezy.hr/p/8c74db48559e-manager-presales/apply \
            https://gpfs.breezy.hr/p/a7e40801673a-fund-accountant/apply \
            https://north-wind-group.breezy.hr/p/ec078fe1ad56-mechanical-design-engineer-nws-00948/apply \
            https://wheelsonsite-usa.breezy.hr/p/7ea34de6bafa-wheel-repair-technician/apply \
            https://apply.workable.com/advisacare-2/j/E647F1C914/apply/ \
            https://apply.workable.com/americas-pharmacy-group/j/5B881AAD4F/apply/ \
            https://apply.workable.com/blue-united-sourcing/j/575B5471B7/apply/ \
            https://apply.workable.com/apply2day/j/FAD034651E/apply/
      - name: Strict benchmark, Workable and Breezy only
        if: always()
        run: |
          node scripts/browser-eval/strict.cjs --sample scripts/browser-eval/sample.csv --label "wb-${GITHUB_SHA}" --max-per-provider 20 --providers workable,breezy
