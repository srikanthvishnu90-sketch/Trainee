# Strict browser benchmark, Ashby only (task b-ashby). Run on a push to bench/browser-ashby-*: real public postings, dry run
# (non-GET aborted except GraphQL reads, submits trapped, stopped before the click), robots.txt obeyed. No secrets.
name: browser-bench
on:
  push:
    branches: ["bench/browser-*"]
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Playwright and its Chromium
        run: |
          npm ci --prefix tools --no-audit --no-fund
          (cd tools && npx --no-install playwright install --with-deps chromium)
          echo "UPMORE_PLAYWRIGHT_PATH=$GITHUB_WORKSPACE/tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Strict benchmark, Ashby (nothing is submitted)
        run: |
          label="ashby-$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          node scripts/browser-eval/strict.cjs --sample scripts/browser-eval/sample.csv --label "$label" --max-per-provider 20 --providers ashby
          cat "artifacts/browser-eval/$label/strict-summary.md" >> "$GITHUB_STEP_SUMMARY"
