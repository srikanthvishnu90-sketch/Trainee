# D-072 item 4 round 2: a READ-ONLY capture of the round-1 bench's unfinished pages (bench branch only, never a PR). Every
# request but GET/HEAD/OPTIONS is aborted in the browser and logged; form submits are cancelled in the page; no Submit is
# clicked; robots.txt obeyed; paced per provider. A synthetic TEST resume. No secrets. No model. Nothing is submitted.
name: browser-capture-r2
on:
  push:
    branches: ["bench/browser-cap-*"]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Playwright and its Chromium
        run: |
          npm ci --prefix tools --no-audit --no-fund
          (cd tools && npx --no-install playwright install --with-deps chromium)
          echo "UPMORE_PLAYWRIGHT_PATH=$GITHUB_WORKSPACE/tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Capture (read only; nothing is submitted)
        run: node scripts/browser-eval/cap/capture-r4.cjs
