# R10 (owner order 2026-11-09), WO-I fix 15: the POST-DEPLOY live replay of the two observed scenarios (5 user turns) against
# the DEPLOYED agent-chat, as a synthetic test person (scripts/launch/r10-live-replay.ts says exactly who it is and why it cannot
# reach a real employer or contact). Manual only: the owner or the architect dispatches it after a deploy. It is not a gate, not
# scheduled, and never runs on a push or a pull request.
#
# What it may do on production: create one test person (an .invalid address and a synthetic Telegram contact), send the five
# observed turns plus three setup turns to agent-chat as that person, read its rows, and delete it at the end. It sends no
# Telegram message, approves nothing, submits nothing, and stops before a turn once the person's recorded model spend reaches
# the cap (default and maximum $1). It uses only secrets already in the "production" environment; none is printed.
# The report artifact holds the test person's own transcript, files and File-page screenshots (synthetic data, no real person),
# kept 14 days.
name: r10-live-replay
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The deployed commit (release/production) this replay checks"
        required: true
        type: string
      usd_cap:
        description: "Spend cap for this run in dollars (at most 1)"
        required: false
        default: "1"
        type: string
permissions:
  contents: read
concurrency:
  group: r10-live-replay
  cancel-in-progress: false
jobs:
  replay:
    name: live replay (5 observed turns, synthetic test person)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Install psql, poppler and the pinned Playwright Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client poppler-utils
          npm ci --prefix tools --no-audit --no-fund
          (cd tools && npx --no-install playwright install --with-deps chromium)
          echo "UPMORE_PLAYWRIGHT_PATH=$GITHUB_WORKSPACE/tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Dry run (what it will do; touches nothing)
        run: deno run -A --import-map=tests/flow/supabase-npm.json scripts/launch/r10-live-replay.ts --dry-run --sha "$SHA"
        env:
          SHA: ${{ inputs.sha }}
      - name: Live replay
        timeout-minutes: 20
        env:
          SHA: ${{ inputs.sha }}
          R10_LIVE_USD_CAP: ${{ inputs.usd_cap }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: deno run -A --import-map=tests/flow/supabase-npm.json scripts/launch/r10-live-replay.ts --sha "$SHA" --out artifacts/r10-live-replay --cleanup-stale
      - name: Per-item report (in-process suite evidence is not re-run here; item 15 reads the live report)
        if: always()
        run: |
          test -f artifacts/r10-live-replay/r10-live-replay.json || exit 0
          deno run -A scripts/r10-acceptance-report.ts --no-run --evidence artifacts/r10-acceptance --live artifacts/r10-live-replay/r10-live-replay.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r10-live-replay-${{ github.run_id }}
          path: artifacts/r10-live-replay
          retention-days: 14
          if-no-files-found: warn
