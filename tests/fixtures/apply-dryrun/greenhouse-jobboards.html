<!doctype html>
<!-- A local copy of the job-boards.greenhouse.io application form markup as the strict benchmark recorded it (run 42719264485
     DIAG lines: scopely, charlesriverassociates, speechify): label ids, the phone fieldset with its react-select "Country" dial-code
     picker, the "Attach" upload whose button group is re-rendered into the file name, and a second (address) "Country". The
     script stands in for React: it is not Greenhouse's code. Nothing here is posted. -->
<html><head><meta charset="utf-8"><title>Job Application for Engineer at Acme</title>
<style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} [role=listbox]{border:1px solid #ccc}</style></head>
<body><form id="application-form" action="/submit" method="post">
<div class="input-wrapper"><label id="first_name-label" for="first_name" class="label label">First Name<span aria-hidden="true">*</span></label><input id="first_name" class="input input__single-line" aria-label="First Name" aria-required="true" type="text" maxlength="255" autocomplete="given-name" value=""></div>
<div class="input-wrapper"><label id="last_name-label" for="last_name" class="label label">Last Name<span aria-hidden="true">*</span></label><input id="last_name" class="input input__single-line" aria-label="Last Name" aria-required="true" type="text" maxlength="255" value=""></div>
<div class="input-wrapper"><label id="email-label" for="email" class="label label">Email<span aria-hidden="true">*</span></label><input id="email" class="input input__single-line" aria-label="Email" aria-required="true" type="text" value=""></div>
<fieldset class="phone-input"><legend class="visually-hidden">Phone</legend>
 <div class="phone-input__country"><div class="select"><div class="select__container"><label id="country-label" for="country" class="label select__label">Country<span aria-hidden="true">*</span></label>
  <div class="select-shell remix-css-b62m3t-container" data-opts="phone"><div class="select__control"><div class="select__value-container"><div class="select__placeholder">Select...</div><input id="country" role="combobox" aria-required="true" aria-expanded="false" aria-autocomplete="list" type="text" value="" autocomplete="off"></div></div></div>
 </div></div></div>
 <div class="phone-input__input"><div class="input-wrapper"><label id="phone-label" for="phone" class="label label">Phone<span aria-hidden="true">*</span></label><input id="phone" class="input input__single-line" aria-required="true" type="tel" value=""></div></div>
</fieldset>
<div class="file-upload" role="group" aria-labelledby="upload-label-resume"><div id="upload-label-resume" class="label upload-label">Resume/CV<span aria-hidden="true">*</span></div>
 <div class="file-upload__wrapper" id="resume-wrap"><div class="secondary-button"><div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="resume">Attach</label><input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf" required></div></div><button type="button">Dropbox</button></div>
</div>
<div class="file-upload" role="group" aria-labelledby="upload-label-cover_letter"><div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
 <div class="file-upload__wrapper"><div class="secondary-button"><div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="cover_letter">Attach</label><input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div></div>
</div>
<div class="select"><div class="select__container"><label id="question_1-label" for="question_1" class="label select__label">Country<span aria-hidden="true">*</span></label>
 <div class="select-shell remix-css-b62m3t-container" data-opts="addr"><div class="select__control"><div class="select__value-container"><div class="select__placeholder">Select...</div><input id="question_1" role="combobox" aria-required="true" aria-expanded="false" type="text" value="" autocomplete="off"></div></div></div>
</div></div>
<button type="submit">Submit application</button>
</form>
<script>
const OPTS = {
  phone: ["Canada +1", "United Kingdom +44", "United States +1", "United States Minor Outlying Islands +1"],
  addr: ["Canada", "United Kingdom", "United States", "United States Minor Outlying Islands"],
};
for (const shell of document.querySelectorAll(".select-shell")) {
  const input = shell.querySelector("input"), vc = shell.querySelector(".select__value-container"), all = OPTS[shell.dataset.opts];
  let menu = null;
  const close = () => { if (menu) menu.remove(); menu = null; input.setAttribute("aria-expanded", "false"); };
  const open = () => {
    close();
    menu = document.createElement("div"); menu.className = "select__menu"; menu.setAttribute("role", "listbox"); menu.id = `react-select-${input.id}-listbox`;
    const q = input.value.trim().toLowerCase();
    for (const t of all.filter((o) => !q || o.toLowerCase().includes(q))) {
      const o = document.createElement("div"); o.setAttribute("role", "option"); o.className = "select__option";
      const name = t.replace(/ \+\d+$/, ""), dial = (t.match(/\+\d+$/) || [""])[0];
      o.innerHTML = dial ? `<span>${name}</span> <span class="dial">${dial}</span>` : name;
      o.addEventListener("mousedown", (e) => e.preventDefault());
      o.addEventListener("click", () => {
        const ph = vc.querySelector(".select__placeholder, .select__single-value"); if (ph) ph.remove();
        const v = document.createElement("div"); v.className = "select__single-value"; v.textContent = t; vc.prepend(v);
        input.value = ""; close();
      });
      menu.append(o);
    }
    input.setAttribute("aria-expanded", "true"); input.setAttribute("aria-controls", menu.id);
    shell.append(menu);
  };
  input.addEventListener("mousedown", open); input.addEventListener("focus", open); input.addEventListener("input", open);
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
}
// React re-renders the upload: once a file is chosen the Attach button group is unmounted and the file name shown in its place
// (the input itself is gone).
document.getElementById("resume").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  setTimeout(() => {
    const w = document.getElementById("resume-wrap");
    const chip = document.createElement("div"); chip.className = "file-upload__filename"; chip.innerHTML = `<span>${f.name}</span><button type="button" aria-label="Remove file">x</button>`;
    w.replaceWith(chip);
  }, 300);
});
</script></body></html>
