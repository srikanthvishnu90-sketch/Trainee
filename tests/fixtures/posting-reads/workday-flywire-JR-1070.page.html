    <meta name="description" property="og:description" content="Are you ready to trade your job for a journey? Become a FlyMate! Passion, excitement &amp;amp; global collaboration are all core to what it means to be a FlyMate. At Flywire, we’re on a mission to deliver the world’s most important and complex payments. We use our Flywire Advantage - the combination of our next-gen payments platform, proprietary payment network and vertical specific software, to help our clients get paid, and help their customers pay with ease - no matter where they are in the world. What more do we need to truly be unstoppable? Perhaps, that is you! Who we are: Flywire is a global payments enablement and software company, founded more than a decade ago to solve high-stakes, high-value payments. We’ve scaled into new regions and industry verticals and expanded our product offerings to deliver meaningful value to our clients around the world. Today we support more than 5,100 clients across the global education, healthcare, travel &amp;amp; B2B industries, with diverse payment methods across 240 countries &amp;amp; territories and more than 140 currencies. With over 1,400+ global FlyMates, representing more than 40 nationalities, and in 15 offices world-wide, we’re looking for FlyMates to join the next stage of our journey as we continue to grow. The Opportunity We, at Flywire, are looking for a forward-thinking, motivated, and driven Relationship Associate (RA) to drive the delivery and execution of our solution to partner Education Agents in APAC; this individual will work to continuously improve and expand our client relationships in an effort to retain and maximize the value of these partnerships. The Relationship Associate will work with the Director, Agent Partnerships, India in the execution of strategies and tactics designed to increase payer growth, uncover new business with existing clients, improve retention, increase revenue, uncover opportunities for improvement, provide accurate and timely issue resolution and assure clients promote the Flywire Payment Solution. Key Responsibilities Initiate dialog and establish relationships with crucial points of contact Create strategic account plans for each client and groups of clients to maximize utilization, growth and revenue Manage new client on-boarding process Present products and services to clients in an informative, educational, and consultative manner Organise materials and plan territory maps for marketing plans Drive revenue/payer/money moved growth activities and objectives Maintain effective communications with client administrators across multiple offices The role will report to the Senior Manager, Agent Partnerships, focusing on NBFCs and Education Loans.. What We Offer: Competitive compensation Employee Stock Purchase Plan (ESPP) Competitive time off Work with brilliant people globally Learn more about their journeys by checking out #InsideFlywire on social media Wellbeing Programs (Mental Health, Wellness, Yoga/Pilates/HIIT Classes) with Global FlyMates Be a meaningful part in our success - every FlyMate makes an impact Great Talent &amp;amp; Development Programs (Managers Taking Flight – for new or aspiring managers, OneFlywire Career Mobility) Submit today and get started! We are excited to get to know you! Throughout our process you can expect to meet with different FlyMates including the Hiring Manager, Peers on the team, the VP of the department, and a skills assessment. Your Talent Acquisition Partner will walk you through the steps and be your “go-to” person for any questions. Flywire is an equal opportunity employer and follows a policy of administering all employment decisions and personnel actions without regard to race, color, religion, sex, pregnancy, gender identity, national origin, age, ancestry, physical or mental disability, sexual orientation, genetic disposition or carrier status, veteran status, or any other category protected under applicable national, federal, state or local law. At Flywire, curiosity, meaningful growth, impact, and connection shape everything we do. Our people are trusted, humble, smart, and committed to raising the bar. If you are energized by challenging work, thoughtful collaboration, and building solutions that help the world move money seamlessly, you’ll feel at home here. Not seeing the right role today? Introduce yourself anyway. Share your background and interests, and our recruiting team will reach out if we find the perfect match. Our work experience is the combination of everything that is unique about us: our culture, our core values, our sustainability commitments, our recognition programs, and most importantly, our people. We act with integrity, choose to do the right thing, support each other, and thrive as one global team.">
