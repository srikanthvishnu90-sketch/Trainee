<!doctype html>
<!-- Voice mock interview: OFF. Owner directive 2026-11-02: Trainee is Claude-only, no OpenAI calls anywhere, and voice stays off.
     This page is inert: it contacts no voice or realtime service and never asks for the microphone. It only offers the text
     mock, through the career-voice function's "fallback" action with the link's token (read from the fragment, so it never
     reaches the web host). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Voice mock interview</title>
<link rel="icon" href="/icon-192.png">
<style>
  :root { --bg: #0B0B0D; --card: #1C1C1F; --text: #F2F2F7; --muted: #A1A1A6; --accent: #34C759; --line: #2C2C2E; }
  @media (prefers-color-scheme: light) { :root { --bg: #F5F5F7; --card: #FFFFFF; --text: #111113; --muted: #5C5C61; --accent: #1F8A3B; --line: #DDDDE2; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: grid; place-items: start center; }
  main { width: min(520px, 100%); padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 16px 0; }
  button { font: inherit; width: 100%; min-height: 50px; border-radius: 14px; border: 0; margin-top: 10px; cursor: pointer; background: var(--accent); color: #fff; font-weight: 600; }
  button[disabled] { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>Voice mock interview</h1>
  <div class="card">
    <p id="status"><b>Voice is not available.</b></p>
    <p class="muted" id="detail">Voice mock interviews are switched off. The text mock works: it runs in your messages.</p>
    <button id="textmock">Do the text mock instead</button>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var m = /[#&]t=([A-Za-z0-9_.-]+)/.exec(location.hash || "");
  var token = m ? m[1] : "";
  var FN = "https://mrwngntwmnaqrqhupvlt.supabase.co/functions/v1/career-voice";
  $("textmock").onclick = function () {
    $("textmock").disabled = true;
    fetch(FN, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "fallback", token: token }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        $("status").textContent = r.status === "OK" ? "The text mock is in your messages now." : "That link can't start the text mock.";
        $("detail").textContent = r.status === "OK" ? "Its first question is waiting there." : 'Text "start a mock interview" instead.';
      })
      .catch(function () { $("status").textContent = "The text mock couldn't start from here."; $("detail").textContent = 'Text "start a mock interview" instead.'; });
  };
})();
</script>
</body>
</html>
